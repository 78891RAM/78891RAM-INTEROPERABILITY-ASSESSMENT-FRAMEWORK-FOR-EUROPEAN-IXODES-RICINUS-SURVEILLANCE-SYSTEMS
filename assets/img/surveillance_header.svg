<svg width="1200" height="120" viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Professional surveillance-themed header background -->
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2d5a3d;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1e4a32;stop-opacity:1"/>
    </linearGradient>
    
    <!-- Subtle pattern for visual interest -->
    <pattern id="gridPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Main background -->
  <rect width="1200" height="120" fill="url(#headerGrad)"/>
  
  <!-- Overlay pattern -->
  <rect width="1200" height="120" fill="url(#gridPattern)"/>
  
  <!-- Decorative elements suggesting surveillance networks -->
  <g opacity="0.1">
    <!-- Network nodes -->
    <circle cx="100" cy="30" r="3" fill="white"/>
    <circle cx="200" cy="45" r="2" fill="white"/>
    <circle cx="300" cy="25" r="2.5" fill="white"/>
    <circle cx="900" cy="35" r="2" fill="white"/>
    <circle cx="1000" cy="50" r="3" fill="white"/>
    <circle cx="1100" cy="40" r="2.5" fill="white"/>
    
    <!-- Connecting lines -->
    <path d="M100,30 L200,45 L300,25" stroke="white" stroke-width="1" fill="none"/>
    <path d="M900,35 L1000,50 L1100,40" stroke="white" stroke-width="1" fill="none"/>
  </g>
</svg>
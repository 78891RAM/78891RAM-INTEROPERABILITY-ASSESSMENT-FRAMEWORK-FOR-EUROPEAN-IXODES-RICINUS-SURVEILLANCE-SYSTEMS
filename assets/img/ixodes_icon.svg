<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Simple, professional tick icon for Ixodes ricinus -->
  <defs>
    <radialGradient id="tickGradient" cx="0.3" cy="0.3" r="0.7">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.1"/>
    </radialGradient>
  </defs>
  
  <!-- Tick body (oval) -->
  <ellipse cx="24" cy="28" rx="8" ry="12" fill="rgba(255,255,255,0.9)" stroke="rgba(255,255,255,0.6)" stroke-width="1"/>
  
  <!-- Tick head (circle) -->
  <circle cx="24" cy="16" r="4" fill="rgba(255,255,255,0.9)" stroke="rgba(255,255,255,0.6)" stroke-width="1"/>
  
  <!-- Legs (simplified lines) -->
  <path d="M16 22 L12 18 M32 22 L36 18 M16 26 L10 24 M32 26 L38 24 M16 32 L12 36 M32 32 L36 36" 
        stroke="rgba(255,255,255,0.7)" stroke-width="1.5" stroke-linecap="round"/>
        
  <!-- Subtle highlight gradient -->
  <ellipse cx="24" cy="28" rx="8" ry="12" fill="url(#tickGradient)"/>
  <circle cx="24" cy="16" r="4" fill="url(#tickGradient)"/>
</svg>
<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Professional empty state background -->
  <defs>
    <linearGradient id="emptyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fdf9;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f0f7f2;stop-opacity:1"/>
    </linearGradient>
    
    <pattern id="subtleGrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(45,90,61,0.04)" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="200" fill="url(#emptyGrad)"/>
  <rect width="400" height="200" fill="url(#subtleGrid)"/>
  
  <!-- Subtle decorative elements -->
  <circle cx="350" cy="50" r="30" fill="rgba(45,90,61,0.03)"/>
  <circle cx="50" cy="150" r="40" fill="rgba(45,90,61,0.02)"/>
  
  <!-- Center emphasis -->
  <circle cx="200" cy="100" r="2" fill="rgba(45,90,61,0.15)"/>
</svg>
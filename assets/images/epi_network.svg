<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <defs>
        <pattern id="epi-network" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
            <!-- Network nodes representing surveillance sites -->
            <g fill="rgba(56, 161, 105, 0.1)" stroke="rgba(56, 161, 105, 0.05)" stroke-width="1">
                <circle cx="20" cy="20" r="4"/>
                <circle cx="80" cy="30" r="3"/>
                <circle cx="50" cy="70" r="5"/>
                <circle cx="70" cy="80" r="3"/>
                <!-- Connections -->
                <line x1="20" y1="20" x2="80" y2="30"/>
                <line x1="80" y1="30" x2="50" y2="70"/>
                <line x1="50" y1="70" x2="70" y2="80"/>
                <line x1="70" y1="80" x2="20" y2="20" opacity="0.3"/>
            </g>
        </pattern>
    </defs>
    <rect width="200" height="200" fill="url(#epi-network)"/>
</svg>
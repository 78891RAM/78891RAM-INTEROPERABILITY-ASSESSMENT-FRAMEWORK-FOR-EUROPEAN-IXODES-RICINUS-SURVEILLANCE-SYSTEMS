<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <pattern id="surveillance-grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(44, 82, 130, 0.1)" stroke-width="0.5"/>
            <!-- Subtle tick dots -->
            <circle cx="10" cy="10" r="0.5" fill="rgba(56, 161, 105, 0.05)"/>
        </pattern>
    </defs>
    <rect width="100" height="100" fill="url(#surveillance-grid)"/>
</svg>